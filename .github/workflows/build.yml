name: Manual Release Build

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: '发布版本号 Tag (如 v0.1.0，留空则使用当前 package.json 版本)'
        required: false
        default: ''
      create_release:
        description: '是否自动创建 GitHub Release 发布'
        type: boolean
        default: true
  push:
    tags:
      - 'v*'

jobs:
  build-tauri:
    name: Build Tauri App (Windows x64)
    runs-on: windows-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install frontend dependencies
        run: pnpm install

      - name: Build Tauri Application & Release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ inputs.release_tag || 'v__VERSION__' }}
          releaseName: "Skills 管理工具 ${{ inputs.release_tag || 'v__VERSION__' }}"
          releaseBody: "基于 Tauri v2 + Rust + React 19 的跨平台桌面客户端，为多 Agent 环境提供 Skills 集中管理与分发挂载。"
          releaseDraft: false
          prerelease: false
          includeRelease: ${{ inputs.create_release != false }}

      - name: Upload Windows NSIS & MSI Artifacts
        if: ${{ inputs.create_release == false }}
        uses: actions/upload-artifact@v4
        with:
          name: skills-manager-windows-x64
          path: |
            src-tauri/target/release/skills-manager.exe
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: warn
