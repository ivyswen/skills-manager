<!doctype html>
<html lang="zh-CN" style="background-color: #020617; color: #f8fafc;">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/app-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Skills Manager</title>
    <style>
      html, body {
        background-color: #020617 !important;
        color: #f8fafc;
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
      }
      #root {
        width: 100%;
        height: 100%;
      }
      .initial-splash {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        height: 100vh;
        background-color: #020617;
        color: #94a3b8;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        user-select: none;
      }
      .initial-splash-logo {
        width: 64px;
        height: 64px;
        border-radius: 14px;
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
        margin-bottom: 1rem;
        object-fit: cover;
      }
      .initial-splash-title {
        font-size: 1.125rem;
        font-weight: 600;
        color: #f1f5f9;
        margin-top: 0.75rem;
        letter-spacing: 0.025em;
      }
      .initial-splash-sub {
        font-size: 0.75rem;
        color: #64748b;
        margin-top: 0.35rem;
      }
      .initial-spinner {
        width: 28px;
        height: 28px;
        border: 3px solid rgba(20, 184, 166, 0.2);
        border-top-color: #14b8a6;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }
      @keyframes spin {
        to { transform: rotate(360deg); }
      }
    </style>
  </head>
  <body class="bg-slate-950 text-slate-100 antialiased select-none" style="background-color: #020617;">
    <div id="root">
      <div class="initial-splash">
        <img src="/app-icon.png" alt="Logo" class="initial-splash-logo" />
        <div class="initial-spinner"></div>
        <div class="initial-splash-title">Skills Manager</div>
        <div class="initial-splash-sub">正在载入组件与系统环境...</div>
      </div>
    </div>
    <script>
      window.addEventListener("contextmenu", function(e) { e.preventDefault(); });
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
